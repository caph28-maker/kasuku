<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasuku · Tareas que se cumplen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <img src="https://drive.google.com/uc?export=view&id=1Om2n3KHcWOrNueTqesI3QzKe_Vc3jL1E" alt="Logo de Kasuku" class="logo">
      <p class="tagline">Tareas que se cumplen. Sin vueltas. Sin redes.</p>
    </header>

    <main>
      <div class="tasks-header">
        <h2>Tareas disponibles</h2>
        <p class="sub">Seleccioná una y contactá al empleador directamente.</p>
      </div>

      <div id="tasks-list" class="tasks-grid">
        <!-- Aquí aparecerán las tareas automáticamente -->
        <div class="loading">Cargando tareas...</div>
      </div>
    </main>

    <footer>
      <p>Kasuku — Donde las tareas se cumplen, sin intermediarios.</p>
    </footer>
  </div>

  <!-- Script principal --->
  <script src="script.js"></script>
</body>
</html>
